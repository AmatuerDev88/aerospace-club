name: Software defect
description: Report reproducible incorrect behavior.
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commit, Python version, OS, command, and smallest public-safe input.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the actual error output. Do not attach private recordings or credentials.
    validations:
      required: true
